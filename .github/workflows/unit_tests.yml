name: Unit Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies (EmailLib)
        run: dotnet restore Paubox_Csharp/EmailLib/EmailLib.csproj

      - name: Build (EmailLib)
        run: dotnet build Paubox_Csharp/EmailLib/EmailLib.csproj --no-restore --configuration Release

      - name: Restore dependencies (UnitTestProject)
        run: dotnet restore Paubox_Csharp/UnitTestProject/UnitTestProject.csproj

      - name: Build (UnitTestProject)
        run: dotnet build Paubox_Csharp/UnitTestProject/UnitTestProject.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test Paubox_Csharp/UnitTestProject/UnitTestProject.csproj --configuration Release --verbosity normal

      - name: Assert the release artifact path
        # The release workflow attaches this exact file, and that job only runs
        # after a tag exists — so a path change would surface with the release
        # already cut. Checking it here makes that a normal CI failure instead.
        run: |
          dll=Paubox_Csharp/EmailLib/bin/Release/net8.0/Paubox.Email.API.dll
          test -f "$dll" || { echo "FAIL: $dll was not produced; update release-please.yml if the path moved" >&2; exit 1; }
          echo "OK: $dll ($(stat -c%s "$dll") bytes)"

  route-check:
    name: Base URLs are routed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe the base URLs the libraries hardcode
        run: |
          grep -rhoE 'https://api\.paubox\.com[a-zA-Z0-9/_.-]*' Paubox_Csharp/EmailLib \
            | .github/scripts/route-check.sh
